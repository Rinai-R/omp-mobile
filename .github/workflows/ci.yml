name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Tests (daemon + app)
        run: npm test
      - name: App typecheck
        run: npm run typecheck

      # What `npm publish` would upload for the daemon, and that its bin starts.
      - name: Daemon package
        run: |
          npm pack --dry-run -w omp-mobile
          node daemon/src/server.mjs --help > /dev/null

      - name: Verify tag matches package and app versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const version = process.env.TAG.slice(1); for (const file of ["package.json", "daemon/package.json", "app/package.json", "app/app.json"]) { const data = JSON.parse(fs.readFileSync(file)); const actual = data.expo?.version ?? data.version; if (actual !== version) { console.error(`${file}: expected ${version}, found ${actual}`); process.exitCode = 1; } }'

      # The release job publishes this section as the GitHub Release description.
      - name: Verify the changelog describes the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! grep -qxF "## ${TAG}" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no \"## ${TAG}\" section."
            exit 1
          fi

  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # React Native's Gradle plugin builds with a Java 17 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      # `android/` is generated from app.json; it is not committed.
      - name: Generate native project
        working-directory: app
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omp-mobile-android
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  npm:
    name: publish npm package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance: a signed statement that this CI run built the package.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # npm shows the README and license that sit in the package directory.
      - name: Add README and license to the package
        run: cp README.md LICENSE NOTICE daemon/

      - name: Publish omp-mobile
        working-directory: daemon
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set."
            exit 1
          fi
          version="${TAG#v}"
          # A rerun after a later job failed must not fail on the version already published.
          if npm view "omp-mobile@${version}" version >/dev/null 2>&1; then
            echo "omp-mobile@${version} is already on npm; skipping."
            exit 0
          fi
          # Prereleases go to the "next" dist-tag so they never become "latest".
          if [[ "$TAG" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi

  release:
    name: publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, android, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: omp-mobile-android
          path: release

      - name: Prepare APK and checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv release/app-release.apk "release/OMP-Mobile-${TAG}.apk"
          cd release
          sha256sum "OMP-Mobile-${TAG}.apk" > "OMP-Mobile-${TAG}.sha256"

      # The description is the tag's section of CHANGELOG.md, up to the next "## " heading.
      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## ${TAG}" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error file=CHANGELOG.md::The \"## ${TAG}\" section of CHANGELOG.md is empty."
            exit 1
          fi

      # --generate-notes appends GitHub's "Full Changelog" link below the description.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            gh release create "$TAG" release/* --verify-tag --notes-file notes.md --generate-notes --prerelease --title "$TAG"
          else
            gh release create "$TAG" release/* --verify-tag --notes-file notes.md --generate-notes --title "$TAG"
          fi
