name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Daemon tests
        run: npm test
      - name: App typecheck
        run: npm run typecheck

  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # React Native's Gradle plugin builds with a Java 17 toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      # `android/` is generated from app.json; it is not committed.
      - name: Generate native project
        working-directory: app
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omp-mobile-android
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
